<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f3ea" />

    <title>أم علي | UM ALI — أناقة تُخاط بإتقان</title>
    <meta
      name="description"
      content="أم علي — أتيليه خياطة وتفصيل حسب الطلب. تفصيل، تطريز، تعديلات وتجهيز المناسبات بعناية في كل غرزة."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Deployed origin. Update here, in `business.siteUrl`, and in the absolute
         URLs below if a custom domain replaces the vercel.app one. -->
    <link rel="canonical" href="https://um-ali.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://um-ali.vercel.app/" />
    <meta property="og:site_name" content="أم علي | UM ALI" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="أم علي | UM ALI — أناقة تُخاط بإتقان" />

      property="og:description"
      content="أتيليه خياطة وتفصيل حسب الطلب. تفصيل، تطريز، تعديلات وتجهيز المناسبات بعناية في كل غرزة."
    />
    <!-- PNG, not SVG: WhatsApp, Facebook and X all reject SVG share images.
         Absolute URL is required — crawlers resolve relative paths
         inconsistently, and Vite does not rewrite `<meta content>`. -->
    <meta property="og:image" content="https://um-ali.vercel.app/images/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="أم علي — أتيليه خياطة وتفصيل" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="أم علي | UM ALI — أناقة تُخاط بإتقان" />
    <meta
      name="twitter:description"
      content="أتيليه خياطة وتفصيل حسب الطلب. تفصيل، تطريز، تعديلات وتجهيز المناسبات."
    />
    <meta name="twitter:image" content="https://um-ali.vercel.app/images/og-cover.png" />
    <meta name="twitter:image:alt" content="أم علي — أتيليه خياطة وتفصيل" />

    <!-- Fonts: two families only — Arabic text + Latin display serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
    />

    <script type="application/ld+json">

        "description": "أتيليه خياطة وتفصيل حسب الطلب: تفصيل، تطريز، تعديلات وتجهيز المناسبات.",
        "url": "https://um-ali.vercel.app/",
        "image": "https://um-ali.vercel.app/images/og-cover.png",
        "sameAs": ["https://www.instagram.com/sewing_amali/"]
      }
    </script>
  </head>
  <body>
